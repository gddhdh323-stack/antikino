<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ ${orderId}</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #e9e9e9;
            background:
                radial-gradient(circle at 82% 45%, rgba(80, 76, 30, 0.13), transparent 34%),
                #090b0c;
        }

        .order-window {
            width: min(520px, 100%);
            padding: 34px 36px;
            border: 1px solid #303235;
            border-radius: 8px;
            background: #151719;
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.38);
            text-align: center;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin: 0px auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #514900;
            border-radius: 50%;
            color: #d8b800;
            font-size: 21px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 600;
        }

        .text {
            margin: 0 auto 25px;
            max-width: 390px;
            color: #929292;
            font-size: 14px;
            line-height: 1.55;
        }

        .order-id {
            padding: 15px 18px;
            border: 1px solid #303235;
            border-radius: 6px;
            background: #101213;
        }

        .order-id-label {
            margin-bottom: 7px;
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .order-id-value {
            color: #e4c400;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .button {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #514900;
            border-radius: 5px;
            color: #d8b800;
            background: #1a1b1c;
            cursor: pointer;
            font-size: 13px
        }
    </style>
</head>
<body>
<main class="order-window">
    <div class="icon">✅</div>

    <h1>Заказ успешно оформлен</h1>

    <p class="text">
        Спасибо за заказ! Сохраните идентификатор заказа,
        он понадобится для его просмотра или обращения в поддержку.
    </p>

    <div class="order-id">
        <div class="order-id-label">ID заказа</div>
        <div class="order-id-value">${orderId}</div>
    </div>


    <form action="/" method="get">
        <button class="button" style="margin-top: 20px">Вернуться на главную</button>
    </form>

</main>
</body>
</html>
